<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../../assets/icons/favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Shelter</title>
  </head>
  <body>
    <header class="header container">
      <div class="header__content">
        <a class="header__logo" href="../main/index.html">
          <h1 class="header__title">Cozy House</h1>
          <div class="header__text">Shelter for pets in Boston</div>
        </a>
        <ul class="header__menu menu">
          <li class="menu__about">
            <a class="header__link" href="../main/index.html"
              >About the shelter</a
            >
          </li>
          <li class="menu__pets">
            <a class="header__link header__link_active" href="#">Our pets</a>
          </li>
          <li class="menu__help">
            <a class="header__link" href="../main/index.html#help"
              >Help the shelter</a
            >
          </li>
          <li class="menu__contacts">
            <a class="header__link" href="#contacts">Contacts</a>
          </li>
        </ul>
      </div>
    </header>
    <main class="main"></main>
    <footer class="footer__wrapper container">
      <div class="footer__content">
        <div class="footer__contacts-wrapper">
          <div class="footer__contacts" id="contacts">
            <div class="footer__title footer__title_contacts">
              For questions and suggestions
            </div>
            <div class="footer__info footer__info_contacts">
              <a class="footer__address" href="mailto:email@shelter.com">
                <img
                  class="footer__icon"
                  src="../../assets/icons/icon-email.svg"
                  alt="email"
                />
                <span>email@shelter.com</span></a
              >
            </div>
            <div class="footer__info footer__info_contacts">
              <a class="footer__address" href="tel:+136745677554">
                <img
                  class="footer__icon"
                  src="../../assets/icons/icon-phone.svg"
                  alt="phone"
                />
                +13 674 567 75 54</a
              >
            </div>
          </div>
          <div class="footer__location">
            <div class="footer__title footer__title_location">
              We are waiting for your visit
            </div>
            <div class="footer__info footer__info_location">
              <a
                class="footer__address"
                href="https://www.google.by/maps/place/1+Central+St,+Boston,+MA+02109,+%D0%A1%D0%A8%D0%90/@42.3585519,-71.0569204,17z/data=!3m1!4b1!4m5!3m4!1s0x89e370868bc2ce7b:0x82fa7db94f5fea9e!8m2!3d42.3585519!4d-71.0547263/"
                target="_blank"
                ><div>
                  <img
                    class="footer__icon"
                    src="../../assets/icons/icon-marker.svg"
                    alt="map"
                  />
                  <p>1 Central Street, Boston (entrance from the store)</p>
                </div></a
              >
            </div>
            <div class="footer__info">
              <a
                class="footer__address"
                href="https://www.google.by/maps/place/%D0%9F%D0%B0%D1%80%D0%BA+%D0%AE%D0%B3/@51.4609685,-0.3886554,10z/data=!4m9!1m2!2m1!1s18+South+Park,+London+!3m5!1s0x48760f79376fa0e3:0x202ac3af5c1ea4ec!8m2!3d51.4691953!4d-0.1941945!15sChUxOCBTb3V0aCBQYXJrLCBMb25kb26SAQRwYXJr"
                target="_blank"
              >
                <img
                  class="footer__icon"
                  src="../../assets/icons/icon-marker.svg"
                  alt="map"
                />
                18 South Park, London
              </a>
            </div>
          </div>
        </div>
        <img
          class="footer__img"
          src="../../assets/images/footer-puppy.png"
          alt="puppy"
        />
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
